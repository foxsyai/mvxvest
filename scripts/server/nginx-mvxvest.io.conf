# mvxvest.io and devnet.mvxvest.io: token vesting on MultiversX.
# Static build served from /var/www/mvxvest.io and /var/www/devnet.mvxvest.io.
# No backend: the app reads the MultiversX API from the browser. Mirrors
# mvxsafe.io on the same droplet, including its ops audit fixes (OPS-04/05/06).
# Added 12 Oct 2026; the nginx tree was backed up first to
# /root/nginx-backup-20261012-mvxvest.tgz. Nothing else on this droplet was touched.
# Source of truth: scripts/server/nginx-mvxvest.io.conf in the mvxvest repo.

server {
    server_name www.mvxvest.io;
    # HSTS on the redirect too, so www is covered (OPS-06).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://mvxvest.io$request_uri;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mvxvest.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mvxvest.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name mvxvest.io;
    root /var/www/mvxvest.io;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    # A page that asks for signatures must never be framed.
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # The app talks to the MultiversX API and the WalletConnect relays and to
    # nothing else (same list as mvxsafe.io). If the app needs a new host, it
    # must be added here or the browser blocks the call.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://wallet.multiversx.com; img-src 'self' data: https://media.elrond.com https://tools.multiversx.com; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.multiversx.com https://gateway.multiversx.com https://tools.multiversx.com https://api.web3modal.org https://explorer-api.walletconnect.com https://pulse.walletconnect.org wss://relay.walletconnect.com wss://relay.walletconnect.org https://socket-api-ovh.multiversx.com wss://socket-api-ovh.multiversx.com; frame-src https://verify.walletconnect.com https://verify.walletconnect.org; upgrade-insecure-requests" always;

    # Public since 13 Oct 2026 (Sebastian opened it after the big audit's
    # fixes); a password guarded the private beta from 12 Oct. The key images
    # are cached for a day only, as the owner can change them (setKeyDisplay);
    # ^~ so the image regex below does not give them 30 days.
    location ^~ /nft/ {
        expires 1d;
    }

    # A single page app: unknown paths are routes, not 404s.
    location / { try_files $uri $uri/ /index.html; }
    # Revalidate the document every time so a deploy reaches returning
    # visitors at once (OPS-04). expires, not add_header: a location with its
    # own add_header would drop every security header above (OPS-05).
    location = /index.html { expires -1; }
    location ~* \.(?:css|js|woff2?|png|jpe?g|webp|avif|svg|ico)$ {
        expires 30d;
        access_log off;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mvxvest.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mvxvest.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# devnet.mvxvest.io: the same app against the MultiversX devnet, play money
# only. noindex so it is never found in search results instead of mvxvest.io.
server {
    server_name devnet.mvxvest.io;
    root /var/www/devnet.mvxvest.io;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://devnet-wallet.multiversx.com; img-src 'self' data: https://media.elrond.com https://tools.multiversx.com; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://devnet-api.multiversx.com https://devnet-gateway.multiversx.com https://tools.multiversx.com https://api.web3modal.org https://explorer-api.walletconnect.com https://pulse.walletconnect.org wss://relay.walletconnect.com wss://relay.walletconnect.org https://devnet-socket-api.multiversx.com wss://devnet-socket-api.multiversx.com; frame-src https://verify.walletconnect.com https://verify.walletconnect.org; upgrade-insecure-requests" always;

    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { expires -1; }
    location ~* \.(?:css|js|woff2?|png|jpe?g|webp|avif|svg|ico)$ {
        expires 7d;
        access_log off;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/devnet.mvxvest.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devnet.mvxvest.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Port 80: the Let's Encrypt challenge (renewals use it), everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name mvxvest.io www.mvxvest.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://mvxvest.io$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name devnet.mvxvest.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://devnet.mvxvest.io$request_uri; }
}
