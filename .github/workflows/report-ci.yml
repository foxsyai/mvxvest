# Posts the result of CI (ci.yml) as the commit status "mvxvest/ci", as the checks GitHub App, which main
# requires (ported from foxsyai/foxleague-agent on 15 Oct 2026): a workflow a pull request brings can name a check "ci", but it
# cannot post as the App (review of the workflows, finding 1).
#
# workflow_run runs this file from main, after CI ends. It never checks out or runs anything of the pull request:
# it reads only the finished run's conclusion, head commit and path. The App's key is a secret of the environment
# "checks", which only main may use, so no workflow on another branch can mint the App's token (review of PR #5).
name: report-ci

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  report:
    name: report ci
    # Only the real CI file (a pull request may add another workflow named CI elsewhere), and only runs of a pull
    # request or of a push to main: a manual run on another branch skips the label and the merge-commit checks
    # (review of PR #5, medium). A pull request that changes ci.yml itself fails the agent review.
    if: ${{ github.event.workflow_run.path == '.github/workflows/ci.yml' && (github.event.workflow_run.event == 'pull_request' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: checks
    # Reads which pull requests a commit belongs to (below); writes nothing.
    permissions:
      pull-requests: read
    steps:
      # A pull request run counts only when it was a pull request INTO main: a run of a pull request into another
      # branch tests that branch's copy of ci.yml, while its result would land on the same head commit. GitHub
      # names the run's pull request when the head is in this repository; for a fork it names none, and then an
      # open pull request into main must have exactly this head.
      - name: The run belongs to a pull request into main
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BASES: ${{ join(github.event.workflow_run.pull_requests.*.base.ref, ' ') }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          if [[ -n "$BASES" ]]; then
            [[ " $BASES " == *" main "* && "$(wc -w <<<"$BASES")" -eq 1 ]] || { echo "::error::this CI run belongs to a pull request into: $BASES, not main"; exit 1; }
          elif [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]]; then
            # A head in this repository always comes with its pull request; without one (closed, or the head moved
            # before the run ended) nothing vouches for the run (third review of PR #5).
            echo "::error::this CI run of a branch of this repository names no pull request into main"; exit 1
          else
            n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq "[.[] | select(.state == \"open\" and .base.ref == \"main\" and .head.sha == \"$SHA\")] | length")
            [[ "$n" -ge 1 ]] || { echo "::error::no open pull request into main has this head"; exit 1; }
          fi

      - name: The App's token, for commit statuses only
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.CHECKS_APP_ID }}
          private-key: ${{ secrets.CHECKS_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write

      - name: Post mvxvest/ci
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          if [[ "$RESULT" == "success" ]]; then state=success; text="contract, dApp and secret scan passed"
          else state=failure; text="CI did not pass ($RESULT)"; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=mvxvest/ci \
            -f description="$text" -f target_url="$RUN" --jq '"posted \(.context): \(.state)"'
