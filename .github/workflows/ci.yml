# CI for mvxvest, as foxsyai/foxleague-agent runs it (ported 15 Oct 2026). It runs when a maintainer marks a pull
# request into main as a merge candidate with the label merge-check (adding a label needs triage or write access),
# on every push to main and on demand. Opening or updating a pull request starts nothing, so nobody can spend the
# project's CI minutes by opening pull requests.
#
# The pull request's code runs here under the plain pull_request event: GitHub's sandbox for it, with no secret and
# a read-only token. The result reaches main as the commit status "mvxvest/ci", posted by the checks GitHub App
# from report-ci.yml, which runs from main and never sees this code. A pull request that changes this file, or
# anything else in .github/ or scripts/ci/, fails the agent review: the maintainer checks such a change by hand.
# A run started by any other label fails unless merge-check is on the pull request (a skipped job would count as
# passed), and a commit pushed after the run has no result: add merge-check again.
name: CI

on:
  pull_request:
    types: [labeled]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    steps:
      - name: Only a merge candidate is tested
        if: ${{ github.event_name == 'pull_request' }}
        env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'merge-check') }}
        run: |
          if [[ "$HAS_LABEL" != "true" ]]; then
            echo "::error::This pull request is not marked merge-check: CI runs only when a maintainer adds that label."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The merge commit of the event is tested, while the result attaches to the pull request's head: its second
      # parent must be that head (read from the commit object, which a shallow checkout has).
      - name: The code tested is the head that gets the result
        if: ${{ github.event_name == 'pull_request' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          second=$(git cat-file -p HEAD | awk '/^parent /{print $2}' | sed -n 2p)
          if [[ "$second" != "$HEAD_SHA" ]]; then
            echo "::error::The pull request changed since merge-check was added: add merge-check again to test its newest commit."
            exit 1
          fi

      - name: The reviewer's workspace gate holds
        run: python3 scripts/ci/test_review_gate.py

  contract:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml (toolchain, wasm target, clippy).
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: true
      - name: Install sc-meta
        run: command -v sc-meta >/dev/null || cargo install multiversx-sc-meta --version 0.66.2 --locked
      - name: Install the Go VM scenario runner
        run: sc-meta install mx-scenario-go
      - name: Format
        run: cargo fmt --all --check
      - name: Build wasm
        working-directory: contracts/vesting
        run: sc-meta all build
      - name: Proxy is up to date
        working-directory: contracts/vesting
        run: sc-meta all proxy && git diff --exit-code -- src/proxy.rs
      - name: Clippy
        run: cargo clippy -p mvxvest --all-targets -- -D warnings
      - name: Tests (Rust VM, and the Go VM scenarios)
        run: cargo test -p mvxvest
      - name: dApp ABI and maths vectors match the contract
        run: |
          python3 - <<'PY'
          import json
          built = json.load(open('contracts/vesting/output/mvxvest.abi.json'))
          used = json.load(open('dapp/src/vesting/mvxvest.abi.json'))
          built.pop('buildInfo', None); used.pop('buildInfo', None)
          assert built == used, 'dapp/src/vesting/mvxvest.abi.json is stale: run pnpm sync-abi in dapp/'
          PY
          cargo test -p mvxvest --test export_vectors -- --ignored
          git diff --exit-code -- dapp/src/vesting/tests/vectors.json
      - name: Contract size and hash
        run: |
          ls -l contracts/vesting/output/mvxvest.wasm
          sha256sum contracts/vesting/output/mvxvest.wasm
      # main (and every pull request into it) must still build, in the pinned
      # image, to code the mainnet site knows: its contractCodeHashes (which
      # also drive the site's red banner) list the deployed hash and, before an
      # upgrade, the next one (audit M3). The hash mainnet runs must be listed
      # too, read from the chain (third audit, C4).
      - name: Reproducible build matches a known mainnet code hash
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          sc-meta reproducible-build build --docker-image multiversx/sdk-rust-contract-builder:v12.0.0 \
            --project . --contract mvxvest --no-docker-interactive --no-docker-tty --overwrite
          python3 - <<'PY'
          import base64, json, re, time, urllib.request
          built = open('output-docker/mvxvest/mvxvest.codehash.txt').read().strip()
          config = open('dapp/src/config/config.mainnet.ts').read()
          listed = re.search(r'contractCodeHashes = \[([^\]]*)\]', config).group(1)
          # A hash commented out inside the array is not listed.
          listed = re.sub(r'//[^\n]*|/\*.*?\*/', '', listed, flags=re.S)
          known = re.findall(r'[0-9a-f]{64}', listed)
          contract = re.search(r"contractAddress =\s*'(erd1[0-9a-z]{58})'", config).group(1)
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(f'https://api.multiversx.com/accounts/{contract}?fields=codeHash', timeout=30) as answer:
                      live = base64.b64decode(json.load(answer)['codeHash']).hex()
                  break
              except Exception:
                  if attempt == 2:
                      raise
                  time.sleep(10)
          print('built', built, 'live', live, 'known', known)
          assert built in known, f'code hash {built} is not in contractCodeHashes of config.mainnet.ts'
          assert live in known, f'mainnet runs {live}, which is not in contractCodeHashes of config.mainnet.ts'
          PY

  dapp:
    needs: gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build (devnet)
        run: pnpm build-devnet

  secrets:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Every action and image by commit or digest, not by a tag that can move (fourth audit, OPS-5).
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --verbose --config /repo/.gitleaks.toml # v8.30.1
